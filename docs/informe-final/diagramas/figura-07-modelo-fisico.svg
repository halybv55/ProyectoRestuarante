<text x="220.83333333333334" y="116" text-anchor="middle" class="head">Motor y conexión</text><text x="88" y="154" class="item">• PostgreSQL 17.5</text><text x="88" y="193" class="item">• pg Pool</text><text x="88" y="232" class="item">• SSL según host</text><text x="88" y="271" class="item">• Variables de entorno</text><line x1="371.6666666666667" y1="310" x2="396.6666666666667" y2="310" class="line"/><rect x="396.6666666666667" y="82" rx="5" width="301.6666666666667" height="455" class="accent"/>
<text x="547.5" y="116" text-anchor="middle" class="head">Integridad</text><text x="414.6666666666667" y="154" class="item">• 22 tablas</text><text x="414.6666666666667" y="193" class="item">• PK y FK</text><text x="414.6666666666667" y="232" class="item">• Checks y únicos</text><text x="414.6666666666667" y="271" class="item">• UUID con pgcrypto</text><line x1="698.3333333333334" y1="310" x2="723.3333333333334" y2="310" class="line"/><rect x="723.3333333333334" y="82" rx="5" width="301.6666666666667" height="455" class="box"/>
<text x="874.1666666666667" y="116" text-anchor="middle" class="head">Optimización</text><text x="741.3333333333334" y="154" class="item">• 14 índices explícitos</text><text x="741.3333333333334" y="193" class="item">• 5 vistas</text><text x="741.3333333333334" y="232" class="item">• Sin triggers</text><text x="741.3333333333334" y="271" class="item">• Sin funciones de usuario</text><text x="560" y="590" text-anchor="middle" class="foot">Fuente: elaboración propia a partir del repositorio auditado.</text></svg>